name: Build Android APK & Windows EXE (OmastroTrivoga)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (v2.0.3)
    runs-on: ubuntu-latest
    outputs:
      sha1: ${{ steps.keystore.outputs.sha1 }}
      sha256: ${{ steps.keystore.outputs.sha256 }}
      keystore_mode: ${{ steps.keystore.outputs.keystore_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Cache persistent CI debug keystore (fallback when secret/file absent)
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: omastro-ci-debug-keystore-v1

      - name: Restore or initialize debug keystore
        id: keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_MODE=""
          if [ -n "${SECRET_KEYSTORE_B64:-}" ]; then
            python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ["SECRET_KEYSTORE_B64"].strip()
          data = base64.b64decode("".join(raw.split()))
          pathlib.Path("debug.keystore").write_bytes(data)
          print(f"Restored debug.keystore from GitHub Secret ({len(data)} bytes)")
          PY
            KEYSTORE_MODE="secret"
          elif [ -f debug.keystore.base64 ]; then
            python3 - <<'PY'
          import base64, pathlib
          raw = pathlib.Path("debug.keystore.base64").read_text(encoding="utf-8-sig").strip()
          data = base64.b64decode("".join(raw.split()))
          pathlib.Path("debug.keystore").write_bytes(data)
          print(f"Restored debug.keystore from debug.keystore.base64 ({len(data)} bytes)")
          PY
            KEYSTORE_MODE="repo"
          elif [ -f .ci-keystore/debug.keystore ]; then
            cp .ci-keystore/debug.keystore debug.keystore
            echo "Restored persistent CI debug.keystore from actions/cache."
            KEYSTORE_MODE="ci_cached"
          else
            mkdir -p .ci-keystore
            keytool -genkeypair -v -keystore .ci-keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp .ci-keystore/debug.keystore debug.keystore
            echo "Generated persistent CI debug.keystore in .ci-keystore/debug.keystore."
            KEYSTORE_MODE="ci_generated"
          fi

          keytool -importkeystore -noprompt -srckeystore debug.keystore -srcstorepass android -srcalias androiddebugkey -destkeystore /tmp/verify_debug.p12 -deststorepass android -destkeypass android >/dev/null
          rm -f /tmp/verify_debug.p12

          KEYTOOL_OUT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android)
          SHA1_FOUND=$(printf '%s\n' "$KEYTOOL_OUT" | awk -F': ' '/SHA1:/{print $2}' | tr -d '[:space:]')
          SHA256_FOUND=$(printf '%s\n' "$KEYTOOL_OUT" | awk -F': ' '/SHA256:/{print $2}' | tr -d '[:space:]')
          SHA1_COMPACT=$(printf '%s' "$SHA1_FOUND" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          echo "Keystore mode: $KEYSTORE_MODE"
          echo "Signing SHA-1: $SHA1_FOUND"
          echo "Signing SHA-256: $SHA256_FOUND"

          echo "sha1=$SHA1_FOUND" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_FOUND" >> "$GITHUB_OUTPUT"
          echo "keystore_mode=$KEYSTORE_MODE" >> "$GITHUB_OUTPUT"
          echo "ACTUAL_SHA1_COMPACT=$SHA1_COMPACT" >> "$GITHUB_ENV"

          {
            echo "### Android APK Signing Certificate"
            echo "- Mode: \`$KEYSTORE_MODE\`"
            echo "- SHA-1: \`$SHA1_FOUND\`"
            echo "- SHA-256: \`$SHA256_FOUND\`"
            if [ "$SHA1_FOUND" != "4B:8A:65:91:77:FC:73:4D:E6:7D:FC:EF:5B:35:47:0B:90:33:43:DB" ]; then
              echo ""
              echo "> **Action required for Google Sign-In:** Add this CI \`SHA-1\` and \`SHA-256\` to Firebase Console (\`gen-lang-client-0900673208\` → Project Settings → Android app \`com.aistudio.omastrotryvoga.krmpqa\`), or configure the \`DEBUG_KEYSTORE_BASE64\` GitHub Actions secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Firebase google-services.json for CI APK build
        run: |
          if [ ! -f app/google-services.json ]; then
            python3 - <<'PY'
          import json, os, pathlib, re
          pc_src = pathlib.Path("desktop_pc/omastro_trivoga_pc.py").read_text(encoding="utf-8")
          api_key = re.search(r'FIREBASE_API_KEY\s*=\s*"([^"]+)"', pc_src).group(1)
          proj_id = re.search(r'FIREBASE_PROJECT_ID\s*=\s*"([^"]+)"', pc_src).group(1)
          web_cid = re.search(r'DEFAULT_GOOGLE_CLIENT_ID\s*=\s*"([^"]+)"', pc_src).group(1)
          proj_num = web_cid.split("-")[0]
          cert_hash = os.environ.get("ACTUAL_SHA1_COMPACT", "4b8a659177fc734de67dfcef5b35470b903343db")
          gs = {
              "project_info": {
                  "project_number": proj_num,
                  "project_id": proj_id,
                  "storage_bucket": f"{proj_id}.firebasestorage.app",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": f"1:{proj_num}:android:e98bcee730a2bb2a24fdb5",
                      "android_client_info": {"package_name": "com.aistudio.omastrotryvoga.krmpqa"},
                  },
                  "oauth_client": [
                      {
                          "client_id": f"{proj_num}-tc3pg9bamepknesrm661jm2ln1u679qf.apps.googleusercontent.com",
                          "client_type": 1,
                          "android_info": {
                              "package_name": "com.aistudio.omastrotryvoga.krmpqa",
                              "certificate_hash": cert_hash,
                          },
                      },
                      {"client_id": web_cid, "client_type": 3},
                  ],
                  "api_key": [{"current_key": api_key}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": web_cid, "client_type": 3}]}},
              }],
              "configuration_version": "1",
          }
          pathlib.Path("app/google-services.json").write_text(json.dumps(gs, indent=2), encoding="utf-8")
          print(f"Generated app/google-services.json for CI build (cert_hash={cert_hash}).")
          PY
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK with versioned filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OmastroTrivoga-v2.0.3.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmastroTrivoga-Android-APK
          path: dist/OmastroTrivoga-v2.0.3.apk
          if-no-files-found: error
          retention-days: 90

  build-exe:
    name: Build Windows PC EXE (v2.0.3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PC Unit Tests & Verify All 12 Audio Tracks
        working-directory: desktop_pc
        run: python -m unittest -v test_omastro_pc.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build OmastroTrivoga.exe (v2.0.3 with Google Login & 2 Admins)
        working-directory: desktop_pc
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "OmastroTrivoga" `
            --add-data "..\app\src\main\res\raw;assets\audio" `
            omastro_trivoga_pc.py

      - name: Upload OmastroTrivoga.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmastroTrivoga-Windows-EXE
          path: desktop_pc/dist/OmastroTrivoga.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release (APK + EXE)
    needs: [build-android-apk, build-exe]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release (APK + Windows EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3-build.${{ github.run_number }}
          name: Омастротривога v2.0.3 (Android APK + Windows EXE)
          body: |
            ### Омастротривога v2.0.3
            - **Android APK:** `OmastroTrivoga-v2.0.3.apk`
            - **Windows PC EXE:** `OmastroTrivoga.exe`

            #### Підпис APK (для Google Sign-In у Firebase Console)
            - Режим ключа: `${{ needs.build-android-apk.outputs.keystore_mode }}`
            - SHA-1: `${{ needs.build-android-apk.outputs.sha1 }}`
            - SHA-256: `${{ needs.build-android-apk.outputs.sha256 }}`

            > Якщо у Firebase Console (`gen-lang-client-0900673208` → Налаштування → Android-додаток `com.aistudio.omastrotryvoga.krmpqa`) ще не додано цей `SHA-1` / `SHA-256`, додайте його для роботи входу через Google на збірках з GitHub.
          files: |
            release-assets/OmastroTrivoga-Android-APK/OmastroTrivoga-v2.0.3.apk
            release-assets/OmastroTrivoga-Windows-EXE/OmastroTrivoga.exe
          generate_release_notes: true
