name: Build Android APK & Windows EXE (OmastroTrivoga)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (v2.0.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore (matches Google Sign-In SHA-1)
        run: tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK with versioned filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OmastroTrivoga-v2.0.1.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmastroTrivoga-Android-APK
          path: dist/OmastroTrivoga-v2.0.1.apk
          if-no-files-found: error
          retention-days: 90

  build-exe:
    name: Build Windows PC EXE (v2.0.1)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PC Unit Tests & Verify All 12 Audio Tracks
        working-directory: desktop_pc
        run: python -m unittest -v test_omastro_pc.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build OmastroTrivoga.exe (v2.0.1 with Google Login & 2 Admins)
        working-directory: desktop_pc
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "OmastroTrivoga" `
            --add-data "..\app\src\main\res\raw;assets\audio" `
            omastro_trivoga_pc.py

      - name: Upload OmastroTrivoga.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmastroTrivoga-Windows-EXE
          path: desktop_pc/dist/OmastroTrivoga.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release (APK + EXE)
    needs: [build-android-apk, build-exe]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release (APK + Windows EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1-build.${{ github.run_number }}
          name: Омастротривога v2.0.1 (Android APK + Windows EXE)
          files: |
            release-assets/OmastroTrivoga-Android-APK/OmastroTrivoga-v2.0.1.apk
            release-assets/OmastroTrivoga-Windows-EXE/OmastroTrivoga.exe
          generate_release_notes: true
